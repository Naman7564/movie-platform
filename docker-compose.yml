services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: filmora_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-filmora-movie-platform-secret-key-2026-prod
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,backend,0.0.0.0,129.159.21.153,129.159.21.153
    volumes:
      - backend_db:/app/
      - backend_media:/app/media/
      - backend_static:/app/staticfiles/
    networks:
      - filmora_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: filmora_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    networks:
      - filmora_network

volumes:
  backend_db:
  backend_media:
  backend_static:

networks:
  filmora_network:
    driver: bridge
